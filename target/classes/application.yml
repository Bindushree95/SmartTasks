spring:
  application:
    name: smarttasks-api
  
  datasource:
    url: jdbc:h2:mem:smarttasks
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: SmartTasksSecretKeyForJWTTokenGenerationAndValidation2024
  expiration: 86400000  # 24 hours in milliseconds

logging:
  level:
    com.smarttasks: INFO
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
